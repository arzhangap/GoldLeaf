{{define "title"}}{{if .Paste.Title}}{{.Paste.Title}}{{else}}مشاهده یادداشت{{end}}{{end}}

{{define "main"}}
<article class="card" id="note">
  <div class="vhead">
    <div>
      <h1 id="vTitle">{{if .Paste.Title}}{{.Paste.Title}}{{else}}بدون عنوان{{end}}</h1>
      <div class="meta"> تاریخ ساخت: <span id="vAge">{{.Paste.Created.Format "2006-01-02 15:04"}}</span></div>
    </div>
    <button class="btn ghost" type="button" id="copyNote">کپی متن</button>
  </div>
  <pre id="vBody" dir="auto">{{.Paste.Body}}</pre>
</article>
{{end}}
