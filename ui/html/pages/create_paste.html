{{define "title"}}ساخت یادداشت{{end}}

{{define "main"}}
<h1>ساخت یادداشت</h1>
<form class="card" id="createForm" method="post" action="/paste/create">
  <label for="title">عنوان</label>
  <input id="title" name="title" placeholder="بدون عنوان">
  {{with index .Form.FieldErrors "title"}}
  <label class="error">{{.}}</label>
  {{end}}

  <label for="body">متن یادداشت</label>
  <textarea id="body" name="body" dir="auto" placeholder="متن یا کدت را اینجا بنویس…"></textarea>
  {{with index .Form.FieldErrors "body"}}
  <label class="error">{{.}}</label>
  {{end}}

  <div class="two">
    <div>
      <label for="exp">انقضا</label>
      <select id="exp" name="expires">
        <option value="1h">یک ساعت</option>
        <option value="1d">یک روز</option>
        <option value="7d">یک هفته</option>
      </select>

      {{with index .Form.FieldErrors "expires"}}
      <div class="error">{{.}}</div>
      {{end}}
    </div>
  </div>

  <button class="btn primary submit" type="submit">ساخت یادداشت</button>
</form>
{{end}}
